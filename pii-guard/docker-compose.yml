services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: piiguard
      POSTGRES_USER: piiguard
      POSTGRES_PASSWORD: piiguard
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/piiguard
      SPRING_DATASOURCE_USERNAME: piiguard
      SPRING_DATASOURCE_PASSWORD: piiguard
      PIIGUARD_HMAC_SECRET: change-me-hmac
      PIIGUARD_VAULT_SECRET: change-me-vault
      PIIGUARD_ADMIN_KEY: change-me-admin
      PIIGUARD_OUTPUT_DIR: /data/output
    volumes:
      - outputs:/data/output

volumes:
  pgdata:
  outputs:
